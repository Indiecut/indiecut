name: Feature request
description: Suggest an improvement or new capability for IndieCut
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Describe the problem you’re solving and the outcome you want. Large features are best discussed before a big PR — see [CONTRIBUTING.md](https://github.com/Indiecut/indiecut/blob/main/CONTRIBUTING.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem / motivation
      description: What are you trying to do that is hard or impossible today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How should IndieCut behave? Keep it concrete.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches you’ve thought about (optional).
  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Mockups, related issues, or platform notes (optional).
