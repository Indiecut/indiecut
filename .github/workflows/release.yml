# Build macOS (.dmg) and Windows (.exe) installers and attach them to a
# GitHub Release. Optionally deploys the web PWA to Cloudflare Pages when
# maintainer secrets are configured (not required for contributors / forks).
#
# Unsigned builds by default (no Apple / Authenticode certs). macOS users may
# need to right-click → Open the first time; Windows may show SmartScreen.
#
# Maintainer-only secrets (optional — web deploy no-ops if unset):
#   CLOUDFLARE_API_TOKEN       — Account → Pages → Edit
#   CLOUDFLARE_ACCOUNT_ID      — Cloudflare account id
#   CLOUDFLARE_PAGES_PROJECT   — Pages project name (e.g. indiecut-app)
# Note: secrets cannot be used in job-level `if:`; deploy-web checks them in a step.

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach installers to (e.g. v1.0.0). Leave empty to only upload artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 was retired (Nov 2026). macos-latest is arm64 and can
          # still cross-build Intel (x64) DMGs via electron-builder.
          - os: macos-latest
            platform: mac
            args: --mac
            artifacts: |
              release/*.dmg
              release/*.blockmap
          - os: windows-latest
            platform: win
            args: --win
            artifacts: |
              release/*-setup.exe
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop renderer
        run: npm run build -w @indiecut/desktop

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  deploy-web:
    name: Deploy web PWA
    runs-on: ubuntu-latest
    permissions:
      contents: read
      deployments: write
    # Job-level `if: secrets.*` is invalid in GitHub Actions. Gate steps instead.
    steps:
      - name: Check Cloudflare Pages secrets
        id: hosting
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_PAGES_PROJECT: ${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
        shell: bash
        run: |
          if [ -n "$CLOUDFLARE_API_TOKEN" ] && [ -n "$CLOUDFLARE_ACCOUNT_ID" ] && [ -n "$CLOUDFLARE_PAGES_PROJECT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "Skipping web deploy — Cloudflare Pages secrets not configured"
          fi

      - name: Checkout
        if: steps.hosting.outputs.enabled == 'true'
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: steps.hosting.outputs.enabled == 'true'
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        if: steps.hosting.outputs.enabled == 'true'
        run: npm ci

      - name: Build web PWA
        if: steps.hosting.outputs.enabled == 'true'
        run: npm run build:web

      - name: Deploy to Cloudflare Pages
        if: steps.hosting.outputs.enabled == 'true'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/web/dist --project-name=${{ secrets.CLOUDFLARE_PAGES_PROJECT }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  publish:
    name: Publish GitHub Release
    needs: [build, deploy-web]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      needs.deploy-web.result == 'success' &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: find installers -type f | sort

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found"
            exit 1
          fi

          NOTES=$(cat <<'EOF'
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | [IndieCut-mac-arm64.dmg](https://github.com/Indiecut/indiecut/releases/latest/download/IndieCut-mac-arm64.dmg) |
          | macOS (Intel) | [IndieCut-mac-x64.dmg](https://github.com/Indiecut/indiecut/releases/latest/download/IndieCut-mac-x64.dmg) |
          | Windows (x64) | [IndieCut-win-x64-setup.exe](https://github.com/Indiecut/indiecut/releases/latest/download/IndieCut-win-x64-setup.exe) |

          ### First launch notes

          - **macOS:** builds are unsigned. If Gatekeeper blocks the app, right-click the app → **Open**, then confirm.
          - **Windows:** builds are unsigned. SmartScreen may warn — choose **More info** → **Run anyway**.
          EOF
          )
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^          //')

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uploading assets to existing release $TAG"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --notes "$NOTES"
          fi
