# Build macOS (.dmg) and Windows (.exe) installers and attach them to a
# GitHub Release. Optionally deploys the web PWA when maintainer Hosting
# secrets are configured (not required for contributors / forks).
#
# Unsigned builds by default (no Apple / Authenticode certs). macOS users may
# need to right-click → Open the first time; Windows may show SmartScreen.
#
# Maintainer-only secrets (optional — skip web deploy if unset):
#   FIREBASE_SERVICE_ACCOUNT  — service account JSON
#   FIREBASE_PROJECT_ID       — Firebase / GCP project id (may differ from site)
#   FIREBASE_HOSTING_CONFIG   — full firebase.json text (include "site": "indiecut-app")

name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to attach installers to (e.g. v1.0.0). Leave empty to only upload artifacts."
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macos-14 was retired (Nov 2026). macos-latest is arm64 and can
          # still cross-build Intel (x64) DMGs via electron-builder.
          - os: macos-latest
            platform: mac
            args: --mac
            artifacts: |
              release/*.dmg
              release/*.blockmap
          - os: windows-latest
            platform: win
            args: --win
            artifacts: |
              release/*-setup.exe
              release/*.blockmap

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build desktop renderer
        run: npm run build -w @indiecut/desktop

      - name: Package installers
        working-directory: apps/desktop
        shell: bash
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx --no-install electron-builder ${{ matrix.args }} --publish never

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v6
        with:
          name: installers-${{ matrix.platform }}
          path: ${{ matrix.artifacts }}
          if-no-files-found: error

  deploy-web:
    name: Deploy web PWA
    runs-on: ubuntu-latest
    # Skip when maintainer Hosting secrets are not configured (forks / local mirrors).
    if: ${{ secrets.FIREBASE_SERVICE_ACCOUNT != '' && secrets.FIREBASE_PROJECT_ID != '' && secrets.FIREBASE_HOSTING_CONFIG != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web PWA
        run: npm run build:web

      - name: Write maintainer Hosting config
        env:
          FIREBASE_PROJECT_ID: ${{ secrets.FIREBASE_PROJECT_ID }}
          FIREBASE_HOSTING_CONFIG: ${{ secrets.FIREBASE_HOSTING_CONFIG }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$FIREBASE_HOSTING_CONFIG" > firebase.json
          printf '{"projects":{"default":"%s"}}\n' "$FIREBASE_PROJECT_ID" > .firebaserc
          # Sanity: must point at the web build output
          grep -q 'apps/web/dist' firebase.json

      - name: Deploy Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          channelId: live
          projectId: ${{ secrets.FIREBASE_PROJECT_ID }}

  publish:
    name: Publish GitHub Release
    needs: [build, deploy-web]
    runs-on: ubuntu-latest
    if: |
      always() &&
      needs.build.result == 'success' &&
      (needs.deploy-web.result == 'success' || needs.deploy-web.result == 'skipped') &&
      (startsWith(github.ref, 'refs/tags/v') || inputs.tag != '')
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Download installers
        uses: actions/download-artifact@v7
        with:
          path: installers
          pattern: installers-*
          merge-multiple: true

      - name: List artifacts
        shell: bash
        run: find installers -type f | sort

      - name: Resolve tag
        id: meta
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${{ inputs.tag }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ steps.meta.outputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          files=(installers/*)
          if [ ${#files[@]} -eq 0 ]; then
            echo "No installer files found"
            exit 1
          fi

          NOTES=$(cat <<'EOF'
          ## Downloads

          | Platform | File |
          | --- | --- |
          | macOS (Apple Silicon) | [IndieCut-mac-arm64.dmg](https://github.com/Indiecut/indiecut/releases/latest/download/IndieCut-mac-arm64.dmg) |
          | macOS (Intel) | [IndieCut-mac-x64.dmg](https://github.com/Indiecut/indiecut/releases/latest/download/IndieCut-mac-x64.dmg) |
          | Windows (x64) | [IndieCut-win-x64-setup.exe](https://github.com/Indiecut/indiecut/releases/latest/download/IndieCut-win-x64-setup.exe) |

          ### First launch notes

          - **macOS:** builds are unsigned. If Gatekeeper blocks the app, right-click the app → **Open**, then confirm.
          - **Windows:** builds are unsigned. SmartScreen may warn — choose **More info** → **Run anyway**.
          EOF
          )
          NOTES=$(printf '%s\n' "$NOTES" | sed 's/^          //')

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Uploading assets to existing release $TAG"
            gh release upload "$TAG" "${files[@]}" --clobber
          else
            echo "Creating release $TAG"
            gh release create "$TAG" "${files[@]}" \
              --title "$TAG" \
              --notes "$NOTES"
          fi
