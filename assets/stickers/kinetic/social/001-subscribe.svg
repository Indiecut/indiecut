<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="512" height="512">
    
    <defs>
      <linearGradient id="stk_1_grad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#FF3366" />
        <stop offset="100%" stop-color="#6366F1" />
      </linearGradient>
      <linearGradient id="stk_1_shine" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.28" />
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.0" />
      </linearGradient>
  
      <filter id="stk_1_fx" x="-20%" y="-20%" width="140%" height="140%">
        <feMorphology in="SourceAlpha" operator="dilate" radius="6" result="dilated"/>
        <feFlood flood-color="#FFFFFF" result="white"/>
        <feComposite in="white" in2="dilated" operator="in" result="outline"/>
        <feDropShadow in="outline" dx="0" dy="6" stdDeviation="5" flood-color="#000000" flood-opacity="0.55" result="shadow"/>
        <feMerge>
          <feMergeNode in="shadow"/>
          <feMergeNode in="outline"/>
          <feMergeNode in="SourceGraphic"/>
        </feMerge>
      </filter>
    </defs>
    <g filter="url(#stk_1_fx)">
      
        <rect x="24" y="82" width="212" height="96" rx="26" fill="#0F172A" stroke="#0F172A" stroke-width="4.2"/>
        <rect x="18" y="74" width="212" height="96" rx="26" fill="#FF3366" stroke="#0F172A" stroke-width="4.2"/>
        <rect x="24" y="80" width="200" height="42" rx="18" fill="url(#stk_1_shine)"/>
        <!-- Left Play Emblem -->
        <circle cx="68" cy="122" r="28" fill="#FFFFFF" stroke="#0F172A" stroke-width="3.57"/>
        <polygon points="60,107 60,137 84,122" fill="#FF3366" stroke="#0F172A" stroke-width="2.7300000000000004" stroke-linejoin="round"/>
        <!-- Graphic UI Equalizer / Skeleton Bars (Instead of Text) -->
        <rect x="110" y="102" width="84" height="16" rx="8" fill="#FFFFFF" stroke="#0F172A" stroke-width="2.7300000000000004"/>
        <rect x="110" y="128" width="56" height="12" rx="6" fill="#FACC15" stroke="#0F172A" stroke-width="2.52"/>
        <!-- Pointer Hand / Cursor Click -->
        <circle cx="202" cy="158" r="20" fill="#FACC15" stroke="#0F172A" stroke-width="3.1500000000000004"/>
        <polygon points="196,148 196,170 203,164 209,174 214,171 208,161 216,159" fill="#0F172A"/>
      
    </g>
  </svg>